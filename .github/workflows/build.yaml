name: '🏗️ Build jellyfin-ffmpeg'

# Fork-only: build just the Debian trixie amd64 package for the QSV caption SEI fix test.
on:
  push:
    branches:
      - qsvfix-build
  workflow_dispatch:

jobs:
  build_debian:
    uses: ./.github/workflows/_meta.yaml
    with:
      distro: 'debian'
      codenames: '["trixie"]'
      architectures: '["amd64"]'
      release: false
